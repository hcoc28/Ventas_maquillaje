services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eclat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # En Docker Desktop (Windows/Mac), host.docker.internal resuelve a la máquina anfitriona,
      # donde corre la instancia real de SQL Server. En Linux, usa la IP de la red del host
      # o agrega `extra_hosts: ["host.docker.internal:host-gateway"]`.
      DB_SERVER: ${DB_SERVER:-host.docker.internal}
    ports:
      - "3000:3000"
    networks:
      - eclat-network

  nginx:
    image: nginx:1.27-alpine
    container_name: eclat-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eclat-network

networks:
  eclat-network:
    driver: bridge
